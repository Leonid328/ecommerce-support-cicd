name: ecommerce CI/CD

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/leonid328/ecommerce-support-cicd/support-agent
  PYTHON_VERSION: "3.11"

jobs:
  quality-gates:
    name: Quality gates (CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy pytest
          pip install -r requirements-serve.txt
      - name: flake8
        run: flake8 src/api.py src/recommend.py src/__init__.py tests/test_model_quality.py scripts/drift_check.py --max-line-length=100 --extend-ignore=E203
      - name: mypy
        run: mypy src/api.py src/recommend.py --ignore-missing-imports --no-error-summary
      - name: Model quality gate
        env:
          PYTHONPATH: .
        run: pytest tests/test_model_quality.py -v --tb=short

  build:
    name: Build image (git SHA tag)
    needs: quality-gates
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Image size gate (<500MB)
        run: |
          docker pull ${{ env.IMAGE }}:sha-${{ github.sha }}
          bytes=$(docker image inspect ${{ env.IMAGE }}:sha-${{ github.sha }} --format '{{.Size}}')
          mb=$((bytes / 1024 / 1024))
          echo "image size=${mb}MB"
          test "$mb" -lt 500

  staging:
    name: Staging + smoke tests
    needs: build
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke health and prediction
        run: |
          docker run -d --name agent -p 8000:8000 ${{ env.IMAGE }}:sha-${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q ok; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"user_clicks":[1,2,3],"k":5}' | grep items
          docker rm -f agent

  production:
    name: Production (manual approval)
    needs: staging
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote SHA image
        run: |
          echo "Promoting ${{ env.IMAGE }}:sha-${{ github.sha }} after approval"
          docker pull ${{ env.IMAGE }}:sha-${{ github.sha }}
          docker tag ${{ env.IMAGE }}:sha-${{ github.sha }} ${{ env.IMAGE }}:prod
          docker push ${{ env.IMAGE }}:prod

  drift:
    name: Daily data drift check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-serve.txt
      - run: PYTHONPATH=. python scripts/drift_check.py
